apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-secret-from-json
spec:
  workspaces:
  - name: workspace
    description: |
      The workspace folder with the automation repository including platform_config.
    mountPath: /workspace

  params:
    - name: image
      description: The docker image used for executing the command (the ci base image)
      default: "julianweberdev/ubuntu-ci-minimal:latest"

    - name: environment
      description: |
        The environment whose cluster the Secret is written to — the first positional of every
        command that touches a cluster (§9.1). It is the *claim about the environment*: what the
        environment's `static.json` declares is what this command says it is writing to, and the
        statement below is what says where the write happens. §10.4's comparison is what keeps the
        two from being the same sentence.
      type: string

    - name: cluster-kubeconfig
      description: |
        **The kubeconfig this step's `kmt` reads the cluster from, and it is not optional: a TaskRun
        that does not name it is refused.** §10 R-10.4's stated cluster, in v2's own layer-1 shape.

        The reason a Task inside a cluster has to state a file that its own service account already
        answers for is v2's resolution order: a cloned configuration's `static.json` (layer 3) ranks
        **ahead of** the mounted service account (layer 4), and the layer does not fall through when
        its file is missing. So a pod that says nothing does not quietly resolve to the cluster it is
        standing on — it errors on `CLUSTER_KUBECONFIG_PATH`, a machine-local path the clone carries
        and the pod does not (R-6.1 calls that key an absolute path in a shared tree, which is a
        mistake `config validate` warns about for exactly this reason).

        What stating it does, and does not, do: the file the run names is the file that gets opened,
        and the context asked of that file is still the environment's `CLUSTER_KUBE_CONTEXT`. When the
        stated file does not declare that context, `kmt` refuses and names both claims rather than
        choosing one. §10.4's rule about that disagreement is that kubementat does not get to settle
        it: the clone's declaration says *which environment* this is, the statement says *where the
        work runs*, and a pod that silently picked the second would install one environment's
        platform into another environment's cluster.

        An empty value is an answer and not an omission — it says "the environment's own declaration
        answers, and this run has no statement to make". A pod that leaves it empty is a pod that
        will fail on the clone's dead path, so it should not. Nothing here is derived from the
        configuration root: §8 deleted the lookup that used to answer which cluster a step meant.
      type: string
    - name: target-namespace
      description: The namespace where the secret should be created
      type: string
    - name: secret-name
      description: A name for the secret that should be created
      type: string
    - name: json-file-location
      description: |
        The location of the json file whose keys become the data entries of the secret. A flat
        json object of key/value pairs, given as a path inside the workspace, e.g.:
        /workspace/<automation-git-project-name>/platform_config/dev/secrets/terraform.tfvars.json
    - name: automation-git-project-name
      description: e.g. kubementat
      type: string
    - name: configuration-root
      description: |
        The directory that carries the environment directories -- what `--config-dir` is handed, and
        therefore the only root this Task reads. §10 R-10.1's second clause: every `kmt` invocation names
        its root, and under source B that root is a clone of the configuration repository rather than
        `platform_config` inside the code checkout -- so it is named here instead of rebuilt from
        `automation-git-project-name`, which names the *code* clone and has been asked to stop meaning
        configuration.

        Nothing is appended to it. It is the directory that holds `<environment>/static.json`, and §5 puts
        that one level below the root of a configuration repository, so a §5 clone *is* the root. A
        combined tree that keeps `platform_config/` inside a checkout (§14.2) is not served by an append:
        §14.2 tells that operator to point the root *at* `<checkout>/platform_config`, so the value they
        pass carries the level and this script does not. §13.1's own rule is the reason this is written
        out: a root is named and never located, and a Task that adds a path segment is locating a root it
        was told. `--config-dir` of `<clone>/platform_config` against a §5 tree is one directory too deep,
        and it answers `no environment in ... declares a cluster` about a clone that does declare one --
        which is a bug in this file, not a misconfiguration by the operator.

        This Task has no `workingDir`: the `cd` in the script below is what puts `uv` inside the project,
        and that is a different directory from the one the command reads. Both are stated so neither is
        inferred from the other.
      default: "$(workspaces.workspace.path)/configuration"

  steps:
    - name: create-secret
      computeResources:
        requests:
          memory: 50Mi
          cpu: 50m
        limits:
          memory: 100Mi
          cpu: 200m
      image: "$(params.image)"
      env:
        # The checkout `uv` resolves the entry point from. It is not what the command reads: the
        # root is named by `--config-dir` on the line below, which derives it from this same
        # directory (§10 R-10.1). KUBEMENTAT_HOME names the project, never the configuration root.
        - name: KUBEMENTAT_HOME
          value: "/workspace/$(params.automation-git-project-name)"
      script: |
        #!/usr/bin/env bash
        set -ue

        # The script this step used to run is deleted, and `kmt kubernetes create-secret-from-json` is what it
        # did: the same three arguments after the environment, in the same order, and a flat json
        # object is what the third one names now instead of the contents of that object. The command
        # refuses a value that is itself an object or an array rather than writing something whose
        # shape depends on which `jq` the image carried.
        #
        # The environment is passed first, before the namespace: the command says which cluster it
        # writes to and the namespace is the argument that says where inside it. The script the Task
        # used to run had neither, and that is the hole this param closes.
        #
        # `--config-dir` says which configuration root the command reads, and it is not optional: a
        # root is named and never located, so a command that names none refuses before it reaches a
        # cluster (`config.py:260-300`, and §8 deleted the fallback that used to answer this). The
        # `cd` above is not the answer — it puts `uv` inside the project so the entry point resolves,
        # which is a different directory from the one the command reads. Under §10's source B the two
        # are separate clones mounted into the same workspace, which is why this reads its own param and
        # not `automation-git-project-name`.
        cd "/workspace/$(params.automation-git-project-name)"
        # The two dials that say which cluster and where it is read from, stated the way §10.4 says
        # them: on the command line, in the shape the resolution report repeats back. Both are named
        # by the Task's params rather than found out, because neither `uv`, the workspace, nor the
        # clone can tell a pod which cluster it was scheduled onto.
        uv run --locked --no-dev kmt kubernetes create-secret-from-json \
          "$(params.environment)" \
          "$(params.target-namespace)" \
          "$(params.secret-name)" \
          "$(params.json-file-location)" \
          --config-dir "$(params.configuration-root)" \
          --kubeconfig "$(params.cluster-kubeconfig)"
