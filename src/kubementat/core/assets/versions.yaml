# Every default version kubementat runs with. The single owner — consumers resolve, never copy.
#
# A value lives on exactly one line here, and the consumer that needs it reads it through
# `kubementat.core/versions.py` (the library) or `python -m kubementat.core.versions` (a shell
# script that must not assume `yq`). Nothing here is a fallback: the reader refuses when a key
# this file owes is missing, so a half-deleted entry is an error and not a silent default.
#
# Concourse is the only entry that carries two halves on purpose: the chart version and the
# image tag of the app that chart ships (`appVersion`), and one bump is one edit of both.

charts:
  prometheus:
    version: "29.40.1"
  prometheus-blackbox-exporter:
    version: "11.20.2"
  prometheus-helm-exporter:
    version: "1.4.0+e2eee28"
  grafana:
    version: "14.2.0"
  loki:
    version: "20.2.0"
  alloy:
    version: "1.15.0"
  polaris:
    version: "6.0.1"
  cert-manager:
    version: "v1.21.3"
  traefik:
    version: "42.1.3"
  openbao:
    version: "0.30.6"
  concourse:
    version: "20.3.3"
    image_tag: "8.3.3"

# The binaries kubementat execs against a cluster. Portability rule lives next to the pins in
# `core/constants.py`; this is the number it is read from.
binaries:
  helm: "4.3.1"
  helmfile: "1.7.0"

# The Tekton releases `kmt install` applies, in apply order: pipeline, dashboard (reads the
# Pipelines API), triggers.
tekton:
  pipeline: "1.17.1"
  dashboard: "0.73.0"
  triggers: "0.37.2"

# Consumed only as Docker build args, keyed by the `ARG` name in
# `docker_files/ci_images/ubuntu_ci_minimal/Dockerfile`. `--print-build-args` is the interface.
ci_image:
  BASE_IMAGE_URL: "ubuntu:26.04"
  KUBECTL_MINOR_VERSION: "1.37"
  TKN_CLI_VERSION: "0.46.2"
  YQ_VERSION: "4.54.1"
  HELMFILE_VERSION: "1.8.2"
  HELM_DIFF_VERSION: "3.15.15"
  LINKERD_VERSION: "edge-26.10.1"
  NODE_VERSION: "24.22.1"
  UV_VERSION: "0.13.6"

# Container images that are product shape rather than a cluster's: the build step's builder, the
# Maven task image, and the references the end-to-end harness pulls.
images:
  buildkit: "moby/buildkit:v0.34.2-rootless"
  maven: "maven:3.8.4-openjdk-17-slim"
  registry: "registry:2"
  nginx: "docker.io/library/nginx:1.27-alpine"
  alpine: "docker.io/library/alpine:3.21"

e2e:
  k3s: "v1.36.5+k3s1"
