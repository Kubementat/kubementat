#
# resource definitions
#
# `PipelineResource` is gone: Pipelines v1 serves no such kind, so a git repository is no
# longer declared as a manifest of its own. A workspace carries the clone instead, and
# `tekton_ci/tasks/git-clone.yml` is the task that fills it — a task that used to declare a
# git input resource declares a workspace and reads `$(workspaces.<name>.path)` now. The
# `input-example-task` further down is that migration, done in place.

#
# tasks
#

# hello-world task
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: echo-hello-world
spec:
  steps:
    - name: echo
      image: ubuntu
      command:
        - echo
      args:
        - "Hello World"
    - name: second-step
      image: ubuntu
      env:
        - name: "EXAMPLE_ENV_VAR"
          value: "I AM AN EXAMPLE"
      command:
        - sh
      args:
        - "-c"
        - "echo 'OS-RELASE:'; env; cat /etc/os-release"

---

# task example for using workspaces and parameters
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: input-example-task
spec:
  params:
    - name: filename
      type: string
      description: The filename of the file to cat
      default: README.md
  # v1beta1 declared this as `resources: inputs: - name: git-source, type: git`. v1 removed
  # both PipelineResource and Task input resources, so the repository arrives on a workspace.
  workspaces:
    - name: git-source
      description: The git repository the files are read from
  steps:
    - name: cat-file
      image: ubuntu
      command:
        - cat
      args:
        - $(workspaces.git-source.path)/$(params.filename)
    - name: echo-hello
      image: ubuntu
      command:
        - echo
      args:
        - "Hello World 2"
