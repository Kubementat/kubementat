# Default values for nginx-example.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# rolling update config
rollingUpdate:
  # how many replicas can at most be unavailable during the update
  maxUnavailable: 0
  # how many replicas can be created more than the configured replicaCount?
  maxSurge: 1

# resource requests and limitations
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
resources:
  requests:
    memory: "32Mi"
    cpu: "30m"
  limits:
    memory: "64Mi"
    cpu: "200m"


image:
  repository: nginx
  pullPolicy: Always
  tag: "1.21.3"

imagePullSecrets: []
# [
#   {
#     "name": "docker-registry-secret"
#   }
# ]

nameOverride: ""
fullnameOverride: ""

configuration:
  secrets: []
  env:
    PORT: 80
    SOME_CONFIGURATION_VARIABLE: 'Some value'

hostAliases: {}

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}

service:
  type: ClusterIP

ingress:
  enabled: false
  # The IngressClass that serves this Ingress. Leave it at `traefik` and nothing else is needed:
  # kubementat installs Traefik with `ingressClass.isDefaultClass: true`, so this class is also what
  # answers for an Ingress that names none. Set it to "" only when you want the cluster's own default
  # to decide, and set it to another name only when that cluster serves a controller kubementat does not own.
  className: traefik
  annotations:
    # What the certificate is asked for by. This pair is class-independent: it is cert-manager's
    # contract, and it is what makes the `tls:` block below real rather than decorative.
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/tls-acme: "true"
    # The nginx annotations that used to sit here are gone, and they are gone for two different reasons:
    #   force-ssl-redirect  -> Traefik's `web` entrypoint redirects to `websecure` cluster-wide, which is
    #                          the platform's answer (see
    #                          templates/environment/kubementat_components/traefik/values.encrypted.yaml.template)
    #                          and is one setting instead of one annotation per Ingress.
    #   proxy-body-size     -> Traefik expresses this as a Buffering Middleware, and kubementat ships no
    #                          default middleware for it. Pointing this file at a middleware nobody creates
    #                          is a router that fails to build, not a limit that is relaxed.
    # `rewrite-target` is gone too, for the same reason as proxy-body-size: it is a Middleware
    # (StripPrefix) here, and the value it carried was `/`, which is the path already asked for.
  hosts:
    - host: nginx-example.yourdomain.com
      paths:
        - path: /
  tls:
   - secretName: nginx-example-tls-secret
     hosts:
       - nginx-example.yourdomain.com

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
