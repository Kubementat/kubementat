[project]
name = "kubementat"
version = "2.0.0"
description = "Kubementat is a all in one Open Source solution for enabling your dev teams to configure, maintain, build and deploy on a Kubernetes cluster"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.8",
    "cryptography>=45.0.7",
    "kubernetes>=33.1.0",
    "python-gnupg>=0.5.5",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest==8.1.1",
    "pytest-timeout==2.3.1",
    "coverage==7.6.1",
]

[project.scripts]
kmt = "cli.kmt:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# `include-package-data` is what makes the product's own data travel: what used to sit in
# `kubementat.core.assets.templates` is gone — 1.x's seed copies, deleted once nothing opened them —
# so the remaining data is the helmfile manifest, its values and the Tekton assets:
# no Python, so `packages.find` alone would ship the code and leave the asset directory behind.
# Declaring the glob rather than a `MANIFEST.in` keeps the rule next to the package it describes.
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["kubementat*","cli*"]

[tool.setuptools.package-data]
# Everything the product ships and opens: the helmfile manifest and its values, and the Tekton Tasks/Pipelines plus the
# generator templates they read (`tekton_ci/pipeline-runs` is output and is deliberately not here —
# a half-written manifest inside site-packages is the bug R-12.1 names).
"kubementat.core.assets" = ["values/**/*", "tekton_ci/**/*"]

[project.urls]
Homepage = "https://github.com/Kubementat/kubementat"
Repository = "https://github.com/Kubementat/kubementat"
